<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>GEMMA4 PWD TEST</title>
<style>
  html,body{margin:0;height:100%;background:#f4f6f8;color:#202428;
    font-family:Segoe UI,Arial,sans-serif;display:flex;align-items:center;
    justify-content:center;flex-direction:column;gap:30px}
  input{font-size:34px;padding:16px 22px;border:3px solid #334155;border-radius:10px;width:480px}

</style>
</head>
<body>
  <label for="user">Usuario</label>
  <input id="user" type="text" autocomplete="off" placeholder="usuario">
  <label for="pwd">Contraseña</label>
  <input id="pwd" type="password" autocomplete="off" placeholder="contraseña">
</body>
</html>
