# Tool descriptions for router_v2 (Sprint 8b).
#
# Tool2Vec-style enrichment per Claude Research May 2026 §2:
# `purpose` is a 2-4 line technical summary in English for the dense
# embedding model. `example_queries` are 4-6 natural-language utterances
# per anchor language (ES, EN) that BM25 ingests as lexical signal and
# that the multilingual encoder uses to anchor the tool in semantic
# space. PT/FR/IT/DE coverage piggy-backs on multilingual-e5-small's
# cross-lingual alignment — no explicit queries needed for those.
#
# Editing notes:
#   - `name` MUST match a compound tool name from
#     `gemma4_agent.tools.COMPOUND_TOOL_SCHEMAS`. Mismatches are caught
#     by `test_router_v2.test_yaml_names_match_compound_tools`.
#   - `purpose` ≤ 200 chars: the prompt budget is tight. Capture "what
#     it does + when to use it", not the API surface (the LLM sees the
#     schema directly).
#   - example_queries: 4-6 per language. Mix imperative + declarative
#     + question. ES should include rioplatense forms (voseo, "armame",
#     "decime") — that's the operator's dialect. Avoid templated
#     repetition like "make a pptx / make a docx / make an xlsx";
#     it's redundant for BM25.
#   - DO NOT translate ES queries 1:1 into EN. Diversity beats
#     completeness; BM25 thrives on lexical variety.
#
# Generated for Sprint 8b. Loaded by gemma4_agent/router_v2.py.

- name: office
  purpose: |
    Create and edit office documents — Word (.docx), PowerPoint (.pptx),
    Excel (.xlsx), and PDF export. Use for new-document creation,
    template-driven slides, and converting between formats.
  domain: documents
  example_queries:
    es:
      - "hazme un power point sobre los planetas"
      - "armame una presentacion para mañana"
      - "abri el word que tengo en escritorio"
      - "creame un excel con los gastos del mes"
      - "convertir este docx a pdf"
      - "hoja de calculo para llevar cuentas"
    en:
      - "make a powerpoint about the solar system"
      - "create a presentation for tomorrow"
      - "open the word doc on my desktop"
      - "build a spreadsheet for monthly expenses"
      - "convert this docx to pdf"
      - "draft a report in word"

- name: document
  purpose: |
    Extract text, tables, and images from existing PDF / DOCX / XLSX /
    PPTX / HTML files. Read-only ingestion path; use `office` for
    creation. Includes summarize and compare-documents flows.
  domain: documents
  example_queries:
    es:
      - "leeme el pdf de la factura"
      - "extrae las tablas de este excel"
      - "que dice el documento que te pase"
      - "resumime el word que descargue"
      - "saca el texto del pptx"
      - "compara estos dos pdfs"
    en:
      - "read the invoice pdf"
      - "extract tables from this excel"
      - "what does this document say"
      - "summarize the word file i downloaded"
      - "pull text out of the pptx"
      - "compare these two pdfs"

- name: knowledge
  purpose: |
    Local RAG knowledge base — ingest documents and search across them
    with hybrid BM25 + cross-encoder rerank. Best for "I dropped a few
    PDFs and want to ask questions about them later".
  domain: documents
  example_queries:
    es:
      - "agregá estos pdfs a la base de conocimiento"
      - "que sabes sobre el contrato que te di"
      - "busca en mis documentos donde dice X"
      - "indexa esta carpeta de papers"
      - "consulta mi base sobre Y"
      - "agregame estos archivos al rag"
    en:
      - "add these pdfs to the knowledge base"
      - "what do you know about the contract i shared"
      - "search my documents for X"
      - "index this folder of papers"
      - "query my knowledge base about Y"
      - "ingest these files into rag"

- name: source_manager
  purpose: |
    Persist research sources, URLs, snippets, and file snapshots so
    future answers can cite them. Companion to `web` and
    `fact_check`; not for ad-hoc note-taking (use `notes_tasks`).
  domain: documents
  example_queries:
    es:
      - "guardame esta pagina como fuente"
      - "anotá la URL del paper que encontramos"
      - "mostrame las fuentes que tengo de IA"
      - "borra la fuente vieja sobre Disney"
      - "que sources tengo guardadas"
      - "agregá esta cita al manager de fuentes"
    en:
      - "save this page as a source"
      - "store the url of the paper we found"
      - "list the sources i have about AI"
      - "drop the old Disney source"
      - "show me saved citations"
      - "add this snippet to the source manager"

- name: photo_library
  purpose: |
    Organize a local photo library — scan folders, read EXIF data,
    generate thumbnails, group images by date (YYYY-MM, YYYY-MM-DD).
    No cloud sync, no face recognition.
  domain: documents
  example_queries:
    es:
      - "organiza las fotos por mes"
      - "extrae el exif de estas imagenes"
      - "hacé thumbnails de la carpeta de fotos"
      - "agrupame las fotos del verano por dia"
      - "que metadata tienen mis fotos"
      - "ordena la libreria de fotos por año"
    en:
      - "organize photos by month"
      - "extract exif from these pictures"
      - "make thumbnails for the photo folder"
      - "group summer photos by day"
      - "what metadata do my photos have"
      - "sort the photo library by year"

- name: study
  purpose: |
    Flashcards + SM-2 spaced repetition. Local SQLite-backed. Manages
    decks, adds cards, surfaces what's due today, grades reviews 0-5.
    Personal study aid; not a search tool.
  domain: documents
  example_queries:
    es:
      - "armame un mazo de tarjetas para historia"
      - "agregá esta tarjeta al deck de ingles"
      - "que flashcards me tocan repasar hoy"
      - "borra el mazo viejo de matematica"
      - "guardame este concepto para repaso espaciado"
      - "mostrá las stats de mi estudio"
    en:
      - "make a flashcard deck for history"
      - "add this card to the english deck"
      - "what cards are due today"
      - "drop the old math deck"
      - "store this concept for spaced repetition"
      - "show my study stats"

- name: browser
  purpose: |
    Drive a desktop browser via shell / deep-links — open URLs, search
    in the active browser, play a specific YouTube video, send media
    keys. For programmatic page interaction (click, fill, extract) use
    `browser_real`. For real web research use `web`.
  domain: browser
  example_queries:
    es:
      - "abri opera y andá a youtube"
      - "buscame esto en google"
      - "pone un video de los redonditos en youtube"
      - "abri chrome con la pagina de netflix"
      - "tirá google.com en el navegador"
      - "pausá el video que esta sonando"
    en:
      - "open opera and go to youtube"
      - "search this on google"
      - "play a queen video on youtube"
      - "open chrome with netflix"
      - "fire up google.com in the browser"
      - "pause whatever's playing in the browser"

- name: browser_real
  purpose: |
    Programmatic browser via Playwright over CDP — attach to an
    already-running Chrome / Edge / Opera, navigate, fill, click,
    extract text or tables, screenshot, manage tabs. Use when the
    user needs the agent to *interact* with a specific page state.
  domain: browser
  example_queries:
    es:
      - "lee el contenido de esta pagina que tengo abierta"
      - "completá el formulario en la pestaña actual"
      - "extraé las tablas de esta web"
      - "click en el boton que dice aceptar"
      - "sacá un screenshot de esta pagina"
      - "cerrá la pestaña de gmail"
    en:
      - "read the content of the page i have open"
      - "fill the form in the current tab"
      - "extract tables from this webpage"
      - "click the accept button"
      - "screenshot this page"
      - "close the gmail tab"

- name: web
  purpose: |
    Real web research — search engine queries + page-fetch + content
    extraction across multiple sources. Use for "investigate", "find
    out", current facts, citations. Prefer over `browser` whenever
    the user wants an *answer*, not to look at a page.
  domain: web
  example_queries:
    es:
      - "investiga que paso con la copa del mundo 2026"
      - "buscame info sobre el ultimo iphone"
      - "averigua cuando salio Daredevil Born Again"
      - "que dice internet sobre este tema"
      - "consultar fuentes sobre IA local"
      - "research rapido sobre llama.cpp"
    en:
      - "research what happened in the 2026 world cup"
      - "find out info about the latest iphone"
      - "look up when Daredevil Born Again came out"
      - "what does the web say about this"
      - "check sources about local AI"
      - "do a quick research on llama.cpp"

- name: vision
  purpose: |
    Visual reasoning over the current screen — describe what's shown,
    OCR a region, find a UI element by description. Uses Gemma's
    native vision plus local Tesseract for OCR. Read-only; for
    clicking use `gui` or `uia`.
  domain: vision
  example_queries:
    es:
      - "que hay en pantalla ahora"
      - "describime lo que ves"
      - "leeme lo que dice ese cartel rojo"
      - "donde esta el boton de aceptar en la pantalla"
      - "ocr de esta region"
      - "encuentra el icono de configuracion"
    en:
      - "what's on my screen right now"
      - "describe what you see"
      - "read the red banner"
      - "where is the accept button on the screen"
      - "ocr this region"
      - "find the settings icon"

- name: form_filler
  purpose: |
    HTML form orchestrator on top of `browser_real` — discover form
    fields, plan a fill from a values dict, apply, then submit with
    a confirmation gate. Use when the user pastes data and asks to
    "complete the form".
  domain: browser
  example_queries:
    es:
      - "llename este formulario con estos datos"
      - "completá los campos del form con esta info"
      - "envia el formulario cuando termines"
      - "rellena la planilla web con lo que te paso"
      - "completá los datos de envio en la pagina"
      - "submit el form despues de chequear"
    en:
      - "fill this form with my data"
      - "complete the form fields with this info"
      - "submit the form once it's filled"
      - "auto-fill the shipping page"
      - "fill in the survey with these answers"
      - "submit the form after review"

- name: fact_check
  purpose: |
    Verify a claim against local sources (knowledge base, files,
    sources_manager). TF-IDF lexical match + negation heuristic;
    returns verdict + ranked evidence. Use when the user asks "is
    that true", "verify", "fact-check".
  domain: web
  example_queries:
    es:
      - "es cierto que la copa del mundo fue en 2022"
      - "verifica esta afirmacion contra mis fuentes"
      - "fact check: la luna afecta las mareas"
      - "esto que dice esta nota es verdad"
      - "comprobá si lo que dice X es correcto"
      - "es real lo del cambio climatico segun mis pdfs"
    en:
      - "is it true the world cup was in 2022"
      - "verify this claim against my sources"
      - "fact check: does the moon affect tides"
      - "is what this article says actually correct"
      - "check if X's statement holds up"
      - "is climate change real per my pdfs"

- name: audio
  purpose: |
    System audio control — get/set master volume, mute, list devices,
    and send global media keys (play/pause/stop/next/previous). Use
    for "lower the volume" / "pause whatever is playing" / "skip song".
    For device routing use `audio_device`.
  domain: audio
  example_queries:
    es:
      - "bajame el volumen al 30 porciento"
      - "subi un poco el volumen"
      - "silencio total"
      - "pausá lo que esta sonando"
      - "siguiente cancion"
      - "muteame la compu"
    en:
      - "lower the volume to 30 percent"
      - "turn it up a bit"
      - "mute everything"
      - "pause whatever's playing"
      - "next song"
      - "skip this track"

- name: audio_device
  purpose: |
    Windows audio routing — set default output / input device,
    per-app route override (e.g. Discord to headset, Spotify to
    speakers), snapshot and restore routing presets. Uses
    SoundVolumeView under the hood.
  domain: audio
  example_queries:
    es:
      - "cambia el audio a los auriculares"
      - "mandá el sonido del discord al headset"
      - "que dispositivos de audio tengo"
      - "el microfono al focusrite por favor"
      - "salida de audio a los parlantes"
      - "restaurar el routing de audio anterior"
    en:
      - "switch audio to headphones"
      - "route discord to the headset"
      - "list my audio devices"
      - "set the mic to focusrite"
      - "output to the speakers please"
      - "restore the previous audio routing"

- name: media
  purpose: |
    Play media on streaming platforms — Spotify, YouTube, Netflix,
    Disney+, HBO Max, Prime Video — via deeplinks or web flows.
    Handles auto-play, profile picking, search-and-play. Use for
    "pon X en Netflix", "play Y on Spotify".
  domain: media
  example_queries:
    es:
      - "pone Daredevil en netflix"
      - "reproduce algo de los redonditos en spotify"
      - "dale play a stranger things en netflix"
      - "abri disney+ y pone el ultimo capitulo de loki"
      - "buscá un capitulo de friends en max"
      - "tirá una playlist en spotify"
    en:
      - "play Daredevil on netflix"
      - "play the rolling stones on spotify"
      - "open disney+ and start the latest loki episode"
      - "find an episode of friends on max"
      - "throw on a playlist in spotify"
      - "play something to focus"

- name: media_edit
  purpose: |
    ffmpeg-based audio / video editing — trim, concat, extract audio,
    transcode (mp4/mkv/webm), normalize loudness (EBU R128), generate
    thumbnails, extract subtitles. Local-only; requires ffmpeg.
  domain: media
  example_queries:
    es:
      - "recortá este video del segundo 10 al 30"
      - "extraé el audio de este mp4"
      - "convertí el video a webm"
      - "normalizame el audio del podcast"
      - "saca subtitulos del mkv"
      - "hacé un thumbnail del video"
    en:
      - "trim this video from 10s to 30s"
      - "extract audio from this mp4"
      - "convert the video to webm"
      - "normalize loudness on the podcast"
      - "pull subtitles from the mkv"
      - "make a thumbnail of the video"

- name: steam
  purpose: |
    Steam-specific actions — list installed games, search the library
    or the store, launch a game by name, open the store page for a
    title. Uses steam:// deeplinks. For other launchers (Epic, GOG,
    Xbox) use `game_launcher`.
  domain: gaming
  example_queries:
    es:
      - "abrime el steam"
      - "andá a mi biblioteca de steam"
      - "buscá Hollow Knight en la tienda de steam"
      - "lanzá Hades por steam"
      - "que juegos tengo instalados en steam"
      - "pagina de tienda de Disco Elysium"
    en:
      - "open steam"
      - "go to my steam library"
      - "search Hollow Knight on the steam store"
      - "launch Hades from steam"
      - "list my installed steam games"
      - "open the Disco Elysium store page"

- name: game_launcher
  purpose: |
    Non-Steam launchers — Epic Games, GOG Galaxy, Xbox app, Riot
    Client. Discover installed titles per launcher, launch by name,
    open the library page. Steam has its own dedicated tool.
  domain: gaming
  example_queries:
    es:
      - "abrime League of Legends"
      - "lanzá un juego de epic"
      - "abri el xbox app"
      - "que tengo instalado en gog"
      - "andá a la biblioteca de epic games"
      - "iniciá valorant desde el riot client"
    en:
      - "launch League of Legends"
      - "open an epic games title"
      - "fire up the xbox app"
      - "what's installed on gog"
      - "open my epic games library"
      - "start valorant from riot client"

- name: creative_local
  purpose: |
    Bridge to a local ComfyUI server (default :8188) for Stable
    Diffusion / SDXL / Flux image generation. Submits workflows,
    polls for results, manages the queue. Requires ComfyUI running
    locally.
  domain: media
  example_queries:
    es:
      - "generame una imagen de un astronauta en marte"
      - "armame un prompt para flux"
      - "tirá una imagen estilo anime de un gato"
      - "dale al comfyui que me cree un paisaje"
      - "que esta en cola en comfyui"
      - "interrumpí lo que esta generando comfyui"
    en:
      - "generate an image of an astronaut on mars"
      - "build me a flux prompt"
      - "make an anime-style cat image"
      - "ask comfyui to create a landscape"
      - "what's in the comfyui queue"
      - "stop the current comfyui generation"

- name: whatsapp
  purpose: |
    Send messages, voice notes, images via WhatsApp Web or
    WhatsApp Desktop. Resolves contact names from local
    contacts, opens chats, sends pre-typed text. Use for
    "mandale a X", "decile a Y por whatsapp".
  domain: messaging
  example_queries:
    es:
      - "mandale un whatsapp a mama diciendo que llego tarde"
      - "decile a juan por whatsapp que vamos en camino"
      - "abrime el chat de mi vieja en whatsapp"
      - "mandale un audio a pedro"
      - "responde el ultimo mensaje de marta"
      - "escribile a mi novio que lo amo"
    en:
      - "send a whatsapp to mom saying I'll be late"
      - "tell john on whatsapp we're on our way"
      - "open my mother's whatsapp chat"
      - "send a voice note to peter"
      - "reply to the last message from martha"

- name: email
  purpose: |
    Compose, send, search, read email via Outlook desktop or
    Gmail web. Handles drafting from natural-language brief,
    attachments, replies. Use for "escribile un mail a X",
    "mandale por correo a Y".
  domain: messaging
  example_queries:
    es:
      - "mandale un mail a mi jefe pidiendo el día libre el viernes"
      - "escribile un correo a juan@empresa.com con el adjunto del presupuesto"
      - "respondele al ultimo mail de recursos humanos"
      - "buscame el mail con la factura de luz"
      - "redactame un correo formal para el banco"
      - "abrime gmail"
    en:
      - "send an email to my boss asking for friday off"
      - "write a mail to john@company.com with the budget attached"
      - "reply to the last HR email"
      - "find the email with the electricity bill"
      - "draft a formal email to the bank"

- name: contacts
  purpose: |
    Lookup, create, update, delete contacts in Windows People /
    Outlook / Google Contacts. Resolves "mama", "mi jefe",
    "Juan del trabajo" to canonical entries. Use for finding
    phone numbers, emails, addresses of known people.
  domain: messaging
  example_queries:
    es:
      - "cual es el numero de mama"
      - "guardame el contacto de juan, su numero es 11-2345-6789"
      - "buscame el email de pedro perez"
      - "actualizame el telefono de mi hermana"
      - "mostrame todos mis contactos del trabajo"
      - "borrame el contacto de mi ex"
    en:
      - "what's mom's number"
      - "save john's contact, his phone is 555-1234"
      - "find peter's email"
      - "update my sister's phone"
      - "show me all my work contacts"

- name: notification
  purpose: |
    Manage Windows toast notifications, Action Center, focus
    assist, Do Not Disturb. Read recent notifications, dismiss
    them, mute apps, schedule quiet hours. Use for "no me
    molestes", "mostrame las notificaciones".
  domain: messaging
  example_queries:
    es:
      - "mostrame las notificaciones de hoy"
      - "activa modo no molestar hasta las 6"
      - "silencia las notificaciones de instagram"
      - "limpia todas las notificaciones"
      - "que me llego mientras estaba en la reunion"
      - "desactiva el modo concentracion"
    en:
      - "show me today's notifications"
      - "turn on do not disturb until 6"
      - "mute instagram notifications"
      - "clear all notifications"
      - "what came in while I was in the meeting"

- name: reminder
  purpose: |
    Create, list, snooze, dismiss reminders tied to time or
    location. Different from local_calendar (full events) and
    notes_tasks (todo items). Use for "recordame en 30 min",
    "avisame cuando llegue a casa".
  domain: messaging
  example_queries:
    es:
      - "recordame en 30 minutos que saque la ropa de la lavadora"
      - "avisame mañana a las 9 que tengo que llamar al medico"
      - "recordame cuando llegue a casa que riegue las plantas"
      - "mostrame mis recordatorios activos"
      - "posterga el recordatorio de la pastilla 10 minutos"
      - "borrame el recordatorio de las 5"
    en:
      - "remind me in 30 minutes to take the laundry out"
      - "remind me tomorrow at 9 to call the doctor"
      - "remind me when I get home to water the plants"
      - "show my active reminders"
      - "snooze the pill reminder by 10 minutes"

- name: system
  purpose: |
    Windows system controls — shutdown, restart, lock, sleep,
    hibernate, log off, power plans, brightness, volume,
    timezone, language. Use for "apaga la pc", "ponete oscuro",
    "subi el brillo".
  domain: system
  example_queries:
    es:
      - "apaga la pc en 5 minutos"
      - "reinicia la computadora"
      - "ponete en modo oscuro"
      - "subime el brillo al maximo"
      - "bloquea la pc"
      - "cambia el plan de energia a alto rendimiento"
      - "cambiale el idioma del sistema a ingles"
    en:
      - "shutdown the pc in 5 minutes"
      - "restart the computer"
      - "switch to dark mode"
      - "max brightness please"
      - "lock the pc"
      - "set power plan to high performance"

- name: gui
  purpose: |
    Programmatic mouse + keyboard automation: click coordinates,
    drag, type, key chords, scroll. Lower-level than uia (which
    inspects elements). Use when uia can't find a target and you
    need raw input synthesis. Fallback for legacy apps.
  domain: system
  example_queries:
    es:
      - "haceme click en el boton verde de la esquina"
      - "arrastra el archivo desde el escritorio hasta la papelera"
      - "tipea esto en el cuadro de texto"
      - "moveme el mouse al centro de la pantalla"
      - "tomame una captura y haceme click donde dice aceptar"
      - "scrolleame hasta el final"
    en:
      - "click the green button in the corner"
      - "drag the file from desktop to the trash"
      - "type this in the text box"
      - "move the mouse to the center of the screen"
      - "screenshot and click where it says accept"

- name: uia
  purpose: |
    UI Automation accessor for Windows controls — inspect, query,
    and invoke buttons/menus/text fields via the accessibility
    tree (AutomationId, Name, ControlType). Higher-level than gui:
    finds elements by semantics, not pixels. Use for native apps.
  domain: system
  example_queries:
    es:
      - "apreta el boton aceptar de la ventana"
      - "rellena el campo nombre con Juan"
      - "haceme click en el menu archivo"
      - "buscame el boton guardar de excel"
      - "leeme el texto del cuadro de dialogo"
      - "selecciona la opcion espanol del combo"
    en:
      - "press the OK button in the window"
      - "fill the name field with John"
      - "click the File menu"
      - "find the Save button in Excel"
      - "read the text from the dialog box"

- name: window
  purpose: |
    Window management — list, focus, minimize, maximize, close,
    resize, move, snap left/right, send to other monitor. Use
    for "minimiza esto", "ponelo a la izquierda", "cerra todas
    las ventanas".
  domain: system
  example_queries:
    es:
      - "minimiza chrome"
      - "ponelo a la izquierda de la pantalla"
      - "cerra todas las ventanas excepto el navegador"
      - "manda esta ventana al monitor de la derecha"
      - "maximiza la ventana activa"
      - "mostrame que ventanas tengo abiertas"
      - "achica el word"
    en:
      - "minimize chrome"
      - "snap it to the left of the screen"
      - "close all windows except the browser"
      - "send this window to the right monitor"
      - "maximize the active window"

- name: desktop_layout
  purpose: |
    Virtual desktops, workspace arrangement, save/restore window
    layouts, multi-monitor profiles. Use for "armame un escritorio
    para trabajar", "guardame esta configuracion de ventanas".
  domain: system
  example_queries:
    es:
      - "creame un escritorio virtual nuevo"
      - "cambiame al escritorio 2"
      - "guardame esta disposicion de ventanas como perfil trabajo"
      - "armame un layout para programar: vscode izq, terminal abajo, browser der"
      - "borrame el escritorio 3"
      - "cargame el perfil de gaming"
    en:
      - "create a new virtual desktop"
