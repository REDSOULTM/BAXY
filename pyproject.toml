[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gemma4_agent"
version = "0.1.0"
description = "Local voice-first agent runtime (Gemma 4 / Gemma 3n) with a web UI (FastAPI + pywebview)."
# Runtime interpreter is CPython 3.10 (verified: 3.10.11). The 3.11-only
# training stack (livekit-wakeword) lives in the isolated .venv_livekit and
# is NOT part of this installable package — see CLAUDE.md "Python 3.10
# (runtime) vs 3.11 (training)".
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["dependencies"]

[project.scripts]
gemma4-chat = "gemma4_agent.chat:main"
# gemma4-ui eliminado 2026-06-03: apuntaba a la GUI vieja PyQt6 (borrada).
# Para abrir la UI web: `gemma4-launcher ui` (o python -m gemma4_agent.launcher ui).
gemma4-server = "gemma4_agent.server:main"
gemma4-launcher = "gemma4_agent.launcher:main"

[tool.setuptools.packages.find]
include = ["gemma4_agent*"]
exclude = ["gemma4_agent.docs*", "gemma4_agent.captures*", "gemma4_agent.logs*"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
# testpaths: dónde busca pytest cuando se invoca SIN argumentos. Incluye los dos
# árboles de tests del repo para que el conftest RAÍZ (guards de seguridad: la
# suite NUNCA abre apps) cubra ambos sin que nadie tenga que apuntarlos a mano.
testpaths = ["gemma4_agent/tests", "gemma4_agent/voice/tests"]
# Registered so @pytest.mark.slow / @pytest.mark.gpu don't warn. These ONLY
# tag tests for selection (`-m "not slow"` to skip heavy perf/model tests);
# they do not change default collection — every test still runs by default.
markers = [
    "slow: heavier tests (perf budgets, large stress) — opt out with -m 'not slow'",
    "gpu: loads a real model (ONNX/Whisper) — heavier, CPU-OK but slow",
]
